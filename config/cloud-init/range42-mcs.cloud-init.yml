#cloud-config
hostname: range42-mcs
manage_etc_hosts: true

users:
  - name: range42-operator
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    # Keys injected by provision script when available
    ssh_authorized_keys:
    lock_passwd: false

chpasswd:
  list: |
    range42-operator:RangersChangePasswords2!
  expire: false

packages:
  - etckeeper
  - qemu-guest-agent
  - spice-vdagent
  - git

package_update: true
package_upgrade: true

runcmd:
  - systemctl enable qemu-guest-agent
  - systemctl start qemu-guest-agent
  - systemctl enable spice-vdagent
  - systemctl start spice-vdagent
  - etckeeper init
  - etckeeper commit "Initial commit after cloud-init setup"
  # Clone Range42 repository
  - sudo -u range42-operator git clone https://github.com/range42/range42.git /home/range42-operator/range42
  - chown -R range42-operator:range42-operator /home/range42-operator/range42
  - echo "Setup complete" > /root/cloud-init-done.txt

power_state:
  mode: reboot
  timeout: 300
  condition: true
